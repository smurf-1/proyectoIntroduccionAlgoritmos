<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recibo de Pago</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">

    <!-- Barra de controles -->
    <div class="toolbar no-print">
      <input type="text" id="archivoInput" placeholder="ej: recibo_001.txt" value="ingresa el nombre.txt">
      <button id="btnCargar">📂 Cargar</button>
    </div>
    <p id="estado" class="estado no-print">Esperando archivo...</p>

    <!-- Escena del recibo -->
    <div class="scene">
      <div class="printer-top"></div>

      <div class="receipt" id="receipt">
        <pre id="contenido" class="contenido">Cargando recibo...</pre>
        <div class="tear-edge"></div>
      </div>
    </div>

    <!-- Botones inferiores -->
    <div class="actions no-print">
      <button id="btnImprimir" disabled>Imprimir</button>
      <button id="btnCopiar" disabled>Copiar</button>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
